<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page introuvable - AshuVidz</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <style>
      :root {
        --primary: #f97316;
        --secondary: #fb7185;
        --text-light: #f1f5f9;
        --text-muted: #94a3b8;
        --background: #0f172a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--background);
        color: var(--text-light);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem 1rem;
        text-align: center;
      }

      img {
        width: 96px;
        height: 96px;
      }

      h1 {
        font-size: 2rem;
      }

      p {
        color: var(--text-muted);
        max-width: 40ch;
      }

      a {
        margin-top: 1rem;
        padding: 0.8rem 1.5rem;
        background: var(--primary);
        color: white;
        border-radius: 9999px;
        text-decoration: none;
        font-weight: 600;
      }

      a:hover,
      a:focus-visible {
        background: var(--secondary);
      }
    </style>
  </head>
  <body>
    <img
      src="/assets/Ashuvidz_Logo_trans.webp"
      alt="Logo AshuVidz"
      width="96"
      height="96"
    />
    <h1>Page introuvable</h1>
    <p>
      La page demandée n'existe pas ou a été déplacée. Retrouvez les liens vers
      les vidéos, le Discord et le forum depuis l'accueil.
    </p>
    <a href="/">Retour à l'accueil</a>
  </body>
</html>
